name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Database migrations (Supabase)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npm run sync-migrations
          npx --yes supabase@2 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2 db push --password "$SUPABASE_DB_PASSWORD"

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: OTA update (EAS Update, channel "production")
        if: env.EXPO_TOKEN != ''
        run: eas update --channel production --message "${{ github.sha }}" --non-interactive

      - name: Skipped targets
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.EXPO_TOKEN == ''
        run: echo "::warning::Deploy secrets missing (SUPABASE_ACCESS_TOKEN / EXPO_TOKEN). See docs/CONTRIBUTING.md."
